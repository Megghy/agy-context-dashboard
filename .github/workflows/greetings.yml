name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thank you for opening your first issue in **AGY Context Dashboard**!
            感谢你首次为 **AGY Context Dashboard** 提交 Issue，维护者会尽快查看并回复。

            > 优质的问题反馈与建议同样会被记录到我们的贡献者致谢中（详见 [CONTRIBUTING.md](CONTRIBUTING.md)）。
          pr-message: |
            Thank you for opening your first pull request in **AGY Context Dashboard**!
            感谢你首次为 **AGY Context Dashboard** 提交 Pull Request！

            - 请确认目标分支为 **`dev`**（`main` 仅用于发布）。
            - CI 检查通过并经维护者审核后即可合入，你的头像与贡献也会被记录在贡献者致谢中（详见 [CONTRIBUTING.md](CONTRIBUTING.md)）。
